[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection relies on calling Depends()/Query()/Path()/Body()
# as argument defaults; that is the documented pattern, not the mutable-default-
# argument bug B008 exists to catch. Without this, every endpoint signature trips
# B008 and there is nothing to fix.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]
