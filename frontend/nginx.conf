# Requests are logged without what follows the "?". A search typed in the interface travels as
# `?search=<what was typed>`, often a buyer's name, and nginx's own log line writes the whole
# request (docs/GDPR.md). `?...` marks a query that was dropped, as the backend's access log does.
map $request_uri $logged_uri {
    ~^(?<logged_path>[^?]*)\?    "$logged_path?...";
    default                      $request_uri;
}

# The address it came from, the time, the request without its query, how it went and how long.
# No referer (the address of the page it was made from) and no user agent, which nothing needs.
log_format anvero '$remote_addr [$time_local] "$request_method $logged_uri $server_protocol" '
                  '$status $body_bytes_sent $request_time';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # the image's own path, a link to the container's standard output, so `docker logs` shows it
    access_log /var/log/nginx/access.log anvero;

    # no sniffing a file as another type, no framing by another site, and no
    # addresses sent along to the carriers' and marketplaces' pages we link to;
    # `always` so errors carry them too (a location with its own add_header
    # repeats them, since nginx then drops these)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;

    # the API, on the same origin as the pages: no CORS to configure
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # this proxy is the first hop, so the client's own address replaces
        # whatever it sent: the backend trusts this header for its login rate
        # limit, and appending let a client name a new address on every try
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # an Allegro import can take a while
        proxy_read_timeout 300s;
    }

    # hashed build files never change under the same name
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # every other path is a route of the single-page app
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
