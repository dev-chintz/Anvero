server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # no sniffing a file as another type, no framing by another site, and no
    # addresses sent along to the carriers' and marketplaces' pages we link to;
    # `always` so errors carry them too (a location with its own add_header
    # repeats them, since nginx then drops these)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;

    # the API, on the same origin as the pages: no CORS to configure
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # this proxy is the first hop, so the client's own address replaces
        # whatever it sent: the backend trusts this header for its login rate
        # limit, and appending let a client name a new address on every try
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # an Allegro import can take a while
        proxy_read_timeout 300s;
    }

    # hashed build files never change under the same name
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # every other path is a route of the single-page app
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
